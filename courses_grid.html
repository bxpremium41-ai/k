<!-- 1. Imports (Tailwind + Fonts) -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<!-- 2. Configuration & Styles -->
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Outfit', 'sans-serif'],
          display: ['Space Grotesk', 'sans-serif'],
        },
        colors: {
          brand: {
            primary: '#059669',
          }
        }
      }
    }
  }
</script>

<style>
  /* Smooth fade transition */
  .fade-transition {
    transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
  }
  .fade-out {
    opacity: 0;
    transform: translateY(10px);
  }
  .fade-in {
    opacity: 1;
    transform: translateY(0);
  }
</style>

<!-- 3. The Widget Layout -->
<div class="w-full bg-white py-8 font-sans antialiased">
  <div class="max-w-6xl mx-auto px-4">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
       <h3 class="text-gray-400 font-bold uppercase tracking-widest text-xs md:text-sm">Included Masterclasses</h3>
       <span class="bg-gray-100 text-gray-500 px-3 py-1 rounded-lg text-[10px] md:text-xs font-bold border border-gray-200">6 Courses</span>
    </div>

    <!-- Grid Container -->
    <div id="course-grid" class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-5 fade-transition fade-in min-h-[280px]">
       <!-- Courses will be injected here by JS -->
    </div>
    
  </div>
</div>

<!-- 4. Logic & Data -->
<script>
  (function() {
    const COURSES = [
      { software: 'AUTOCAD', title: 'AutoCAD Mastery', img: 'https://lh3.googleusercontent.com/d/1fV5bz4JDugh8HxLMJ0fXu5K5sDj3qlSR' },
      { software: 'SKETCHUP', title: 'SketchUp Pro', img: 'https://lh3.googleusercontent.com/d/1wl6by5AO5MiPeoYsZ8F6Zi5AJahoeTQo' },
      { software: 'V-RAY', title: 'V-Ray Photorealism', img: 'https://lh3.googleusercontent.com/d/1aHEt_z78tYD_0Cn66DiduAnhwn-o8El8' },
      { software: 'LUMION', title: 'Lumion Cinematic', img: 'https://lh3.googleusercontent.com/d/1XW2DDHVa1Qc15NcZ3wUKMFRT7LkyZMCt' },
      { software: 'D5 RENDER', title: 'D5 Render Realtime', img: 'https://lh3.googleusercontent.com/d/1vbV4j6K9sgzbbZ7qlRdgqPTXWiHBPLsr' },
      { software: 'AI + GEN DESIGN', title: 'AI Architecture', img: 'https://lh3.googleusercontent.com/d/1s-HzZVKpc9F92mLW2gMOPk0kVrKAqUIS' }
    ];

    const gridEl = document.getElementById('course-grid');

    function renderCourses() {
        let html = '';
        COURSES.forEach(course => {
          html += `
            <div class="flex items-center gap-3 p-3 rounded-2xl border border-gray-100 bg-white hover:border-emerald-100 hover:shadow-lg transition-all duration-300 group cursor-default">
                <!-- Image -->
                <div class="w-12 h-12 md:w-14 md:h-14 shrink-0 rounded-xl bg-gray-100 overflow-hidden relative border border-gray-100">
                    <img src="${course.img}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" alt="${course.title}">
                </div>
                <!-- Text -->
                <div class="min-w-0 flex flex-col justify-center">
                    <span class="text-[9px] md:text-[10px] font-bold text-brand-primary uppercase tracking-widest mb-0.5">${course.software}</span>
                    <h4 class="text-xs md:text-sm font-bold text-gray-900 leading-tight truncate pr-2">${course.title}</h4>
                </div>
            </div>
          `;
        });
        gridEl.innerHTML = html;
    }

    renderCourses();
  })();
</script>
